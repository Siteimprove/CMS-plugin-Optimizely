name: Package and CMS integration
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        type: string
        default: ''

permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
      - run: npm run test:unit
      - run: python3 -m unittest discover -s tests/unit -p 'test_*.py' -v

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            global.json
            SiteImprove.Optimizely.Plugin/packages.lock.json
            NuGet.config
      - name: Build and verify the candidate
        env:
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          if [[ -n "$RELEASE_VERSION" ]]; then
            python3 scripts/candidate.py --release-version "$RELEASE_VERSION"
          else
            python3 scripts/candidate.py
          fi
      - name: Exercise verifier against damaged candidates
        run: python3 scripts/test_candidate.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate
          path: artifacts/candidate/
          if-no-files-found: error
          retention-days: 7

  cms:
    name: CMS (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        profile: [cms12-current, cms12-2025]
    needs: [unit, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate
          path: artifacts/candidate
      - run: python3 scripts/host.py --profile "${{ matrix.profile }}"
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Real CMS with controlled Siteimprove responses
        run: python3 scripts/cms_smoke.py
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cms-evidence-${{ matrix.profile }}
          path: |
            artifacts/evidence/**
            !artifacts/evidence/**/*.raw.log
          retention-days: 7
          if-no-files-found: warn

  required:
    name: Package and CMS checks
    needs: [unit, package, cms]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every confidence level in this workflow
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
