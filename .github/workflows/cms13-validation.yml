name: CMS 13 validation

on:
  push:
    branches: [feature/cms13]
  pull_request:
    branches: [feature/cms13]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: dotnet test SiteImprove.Optimizely.Plugin.sln -c Release
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 5
      - run: npm run test:browser
      - run: dotnet pack SiteImprove.Optimizely.Plugin/SiteImprove.Optimizely.Plugin.csproj -c Release -o artifacts/packages -p:ContinuousIntegrationBuild=true
      - run: python3 tests/verify-package.py artifacts/packages/*.nupkg --publish-host
      - name: Record dependency advisories
        run: dotnet list SiteImprove.Optimizely.Plugin/SiteImprove.Optimizely.Plugin.csproj package --vulnerable --include-transitive --format json > artifacts/dependency-advisories.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cms13-validation-${{ github.sha }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/dependency-advisories.json
          if-no-files-found: error
          retention-days: 14
